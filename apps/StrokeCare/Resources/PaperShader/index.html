<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stroke Care Calm Horizon</title>
  <link rel="stylesheet" href="./paper-shader.css">
</head>
<body>
  <main class="shader-stage">
    <div id="paperShader" class="shader-field is-fallback"></div>
    <div id="frequencyDepth" class="frequency-depth" aria-hidden="true"></div>
    <div id="centerText" class="center-text" aria-hidden="true"></div>
    <svg id="wandLayer" class="wand-layer" viewBox="0 0 1000 600" preserveAspectRatio="none" aria-hidden="true"></svg>
    <span id="shaderState" class="shader-state" aria-label="shader status"></span>
  </main>
  <script type="module" src="./paper-shader.js"></script>
</body>
</html>
