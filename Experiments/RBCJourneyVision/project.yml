name: RBCJourneyVision

options:
  bundleIdPrefix: com.arnav
  deploymentTarget:
    visionOS: "2.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: VV6YGTA587

targets:
  RBCJourneyVision:
    type: application
    platform: visionOS
    info:
      path: Resources/RBCJourneyVision-Info.plist
      properties:
        CFBundleDisplayName: Inside the Flow
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.arnav.RBCJourneyVision
            CFBundleURLSchemes:
              - rbcjourney
        NSHandsTrackingUsageDescription: Open and close educational vessel portals with deliberate two-hand gestures.
        UIApplicationSupportsIndirectInputEvents: true
    sources:
      - path: Sources
      - path: Resources/Models/brain_anatomy_realistic_v2.usdz
        buildPhase: resources
      - path: Resources/Models/brain_deep_structures_v2.usdz
        buildPhase: resources
      - path: Resources/Models/brain_ventricles_v2.usdz
        buildPhase: resources
      - path: Resources/Models/cerebral_arteries_realistic_v2.usdz
        buildPhase: resources
      - path: Resources/Models/cranial_vascular_registered_assembly_v2.usdz
        buildPhase: resources
      - path: Resources/Models/ischemic_mca_clot_v2.usdz
        buildPhase: resources
      - path: Resources/Models/artery_wall_cutaway_v2.usdz
        buildPhase: resources
      - path: Resources/Models/artery_interior_bloodflow_v2.usdz
        buildPhase: resources
      - path: Resources/Models/artery_cutaway_complete_v2.usdz
        buildPhase: resources
      - path: Resources/Models/circle_of_willis_flow_overlay_v2.usdz
        buildPhase: resources
      - path: Resources/Models/red_blood_cells_closeup_v2.usdz
        buildPhase: resources
      - path: Resources/Models/microcirculation_arterial_venous_v2.usdz
        buildPhase: resources
      - path: Resources/Models/cerebral_bloodflow_animation_v2.usdz
        buildPhase: resources
      - path: Resources/Models/cerebral_bloodflow_teaching_set_v2.usdz
        buildPhase: resources
      - path: Resources/Audio/FlowBed.wav
        buildPhase: resources
      - path: Resources/Provenance/ATTRIBUTION.md
        buildPhase: resources
      - path: Resources/Provenance/portal-anchor-manifest.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arnav.RBCJourneyVision
        PRODUCT_NAME: RBCJourneyVision
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: 7

schemes:
  RBCJourneyVision:
    build:
      targets:
        RBCJourneyVision: all
